<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Diblaim Palmeira - Estudante de Desenvolvimento de Software</title>
  <desc id="d">Banner com sequência de inicialização de sistema, barra de carregamento e nome do desenvolvedor.</desc>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.55" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#FF2A6D"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#12283A" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="320" rx="14"/></clipPath>
    <style>
      text{font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace}
      .l{font-size:13px;opacity:0}
      .l1{animation:a1 10s infinite}
      .l2{animation:a2 10s infinite}
      .l3{animation:a3 10s infinite}
      .l4{animation:a4 10s infinite}
      @keyframes a1{0%,3%{opacity:0}5%,90%{opacity:1}95%,100%{opacity:0}}
      @keyframes a2{0%,9%{opacity:0}11%,90%{opacity:1}95%,100%{opacity:0}}
      @keyframes a3{0%,15%{opacity:0}17%,90%{opacity:1}95%,100%{opacity:0}}
      @keyframes a4{0%,21%{opacity:0}23%,90%{opacity:1}95%,100%{opacity:0}}
      .bar{transform-box:fill-box;transform-origin:left center;animation:bar 10s infinite}
      @keyframes bar{0%,6%{transform:scaleX(0);opacity:1}34%,90%{transform:scaleX(1);opacity:1}95%,100%{transform:scaleX(1);opacity:0}}
      .pct{opacity:0;animation:a5 10s infinite}
      @keyframes a5{0%,33%{opacity:0}35%,90%{opacity:1}95%,100%{opacity:0}}
      .title{opacity:0;animation:tt 10s infinite}
      @keyframes tt{0%,34%{opacity:0}38%{opacity:1}40%{opacity:.55}42%{opacity:1}44%{opacity:.8}46%,90%{opacity:1}95%,100%{opacity:0}}
      .sub{opacity:0;animation:ss 10s infinite}
      @keyframes ss{0%,44%{opacity:0}50%,90%{opacity:1}95%,100%{opacity:0}}
      .foot{opacity:0;animation:ff 10s infinite}
      @keyframes ff{0%,52%{opacity:0}58%,90%{opacity:1}95%,100%{opacity:0}}
      .ring{transform-box:fill-box;transform-origin:center;animation:spin 20s linear infinite}
      .ring2{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .scan{animation:scan 4.5s linear infinite}
      @keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(330px)}}
      .blink{animation:blink 1.2s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){
        .l,.pct,.title,.sub,.foot{animation:none;opacity:1}
        .bar{animation:none}
        .ring,.ring2,.scan,.blink{animation:none}
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="#070B14"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <ellipse cx="880" cy="40" rx="260" ry="180" fill="#FF2A6D" opacity="0.08"/>
    <ellipse cx="90" cy="320" rx="300" ry="170" fill="#00F0FF" opacity="0.07"/>

    <g transform="translate(870 160)" fill="none">
      <circle class="ring" r="78" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.7"/>
      <circle class="ring2" r="58" stroke="#FF2A6D" stroke-width="1.5" stroke-dasharray="40 14" opacity="0.8"/>
      <circle r="38" stroke="#7B61FF" stroke-width="1" opacity="0.8"/>
      <circle r="6" fill="#00F0FF" opacity="0.9"/>
      <path d="M-96 0H-84M84 0H96M0 -96V-84M0 84V96" stroke="#00F0FF" stroke-width="1.5" opacity="0.6"/>
    </g>

    <text x="40" y="50" class="l l1" fill="#00F0FF">&gt; INICIALIZANDO NUCLEO DO SISTEMA ........ [ OK ]</text>
    <text x="40" y="72" class="l l2" fill="#7FD6E3">&gt; CARREGANDO MODULOS: JAVA | PYTHON | JAVASCRIPT</text>
    <text x="40" y="94" class="l l3" fill="#7FD6E3">&gt; AUTENTICANDO USUARIO: imlean64-gif</text>
    <text x="40" y="116" class="l l4" fill="#00FF9C">&gt; ACESSO CONCEDIDO</text>

    <rect x="40" y="132" width="420" height="10" rx="2" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.6"/>
    <rect class="bar" x="43" y="135" width="414" height="4" rx="1" fill="url(#neon)"/>
    <text x="474" y="142" class="pct" font-size="12" fill="#00F0FF">100%</text>

    <text x="500" y="212" text-anchor="middle" font-size="48" font-weight="700" letter-spacing="5" fill="url(#neon)" filter="url(#glow)" class="title">DIBLAIM PALMEIRA</text>
    <text x="500" y="248" text-anchor="middle" font-size="15" letter-spacing="3" fill="#9FB3C8" class="sub">DESENVOLVIMENTO DE SOFTWARE  //  JAVA - PYTHON - JAVASCRIPT</text>
    <text x="500" y="288" text-anchor="middle" font-size="11" letter-spacing="2" fill="#5B7088" class="foot">[ SALVADOR - BAHIA - BRASIL ]   //   BUILD 2026</text>

    <g transform="translate(958 38)">
      <text text-anchor="end" x="-14" y="4" font-size="12" fill="#00FF9C">SISTEMA ONLINE</text>
      <circle class="blink" r="4" fill="#00FF9C"/>
    </g>

    <rect class="scan" width="1000" height="3" fill="#00F0FF" opacity="0.12"/>
    <rect width="1000" height="320" fill="url(#vig)"/>
  </g>

  <rect x="0.5" y="0.5" width="999" height="319" rx="14" fill="none" stroke="#1B2A41"/>
  <path d="M14 34V14H34M966 14H986V34M986 286V306H966M34 306H14V286" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
